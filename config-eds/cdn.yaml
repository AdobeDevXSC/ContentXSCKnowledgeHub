kind: "CDN"
version: "1"
data:
  originSelectors:
    rules:
      - name: route-stage-xscknowledgehub-cug
        when:
          allOf:
            - { reqProperty: domain, equals: "stage.xscknowledgehub.adobe.com" }
        action:
          type: selectAemOrigin
          originName: edgefunction-knowledge-hub-stage-cug
          skipCache: true
